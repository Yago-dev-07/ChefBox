<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ChefBox</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="assets/css/style.css">

    <link rel="stylesheet" href="assets/css/cadastrar_receita.css">
</head>
<body>
    <header class="cabecalho">
        <a href="../index.html" class="logo">
            <img src="assets/img/logo-chefbox-transparente.png" alt="Logo ChefBox">
        </a>

        <nav class="menu">
            <a href="receitas.html" class="voltar-cabecalho">
                <i class="fa-solid fa-arrow-left"></i>
                Voltar para receitas
            </a>
        </nav>
    </header>

    <main class="principal">
        <section class="secao-principal banner-cadastro">
            <img src="assets/img/hero-cadastrar-receita.png" alt="" class="imagem-principal">


            <div class="gradiente-principal"></div>

            <div class="conteudo-principal">
                <p class="paragrafo-principal">CADASTRAR RECEITA</p>

                <h1 class="titulo">Cadastre uma nova receita</h1>

                <p class="descricao-principal">
                    Adicione uma nova receita ao ChefBox preenchendo as informações abaixo.
                </p>
            </div>
        </section>

        <section class="secao-cadastro">
            
            <form class="cadastro-receita">

                <div class="linha-principal-cadastro">

                    <div class="grupo-dados-cadastro">

                        <div class="campo-cadastro">
                            <label for="nome-receita">
                                <i class="fa-solid fa-utensils"></i>
                                Nome da receita
                            </label>

                            <input type="text" id="nome-receita"
                                name="nome-receita" maxlength="100"
                                placeholder="Digite o nome da receita" class="entrada-cadastro" required>
                        </div>

                        <div class="campo-cadastro">
                            <label for="descricao">
                                <i class="fa-solid fa-align-left"></i>
                                Descrição
                            </label>

                            <textarea id="descricao" name="descricao"
                                placeholder="Descreva brevemente a receita"
                                required></textarea>
                        </div>

                    </div>

                    <div class="campo-cadastro">
                        <span class="titulo-campo">
                            <i class="fa-solid fa-image"></i>
                            Imagem da receita
                        </span>

                        <label for="imagem-receita" class="area-upload">
                            <i class="fa-solid fa-cloud-arrow-up"></i>

                            <span>Adicione uma imagem da receita</span>
                            <small>Clique para selecionar uma imagem</small>
                        </label>
                        
                        <input type="file"      id="imagem-receita"
                            name="imagem-receita" 
                            class="input-arquivo"
                            accept="image/*" required>
                    </div>

                </div>

                <div class="linha-informacoes-cadastro">

                    <div class="campo-cadastro">
                        <label for="categoria">
                            <i class="fa-solid fa-tags"></i>
                            Categoria
                        </label>

                        <select id="categoria" name="categoria" required>
                            <option value="" disabled selected hidden>
                                Selecione a categoria
                            </option>
                            <option value="massas">Massas</option>
                            <option value="carnes">Carnes</option>
                            <option value="vegetarianas">Vegetarianas</option>
                            <option value="sopas">Sopas</option>
                            <option value="sobremesas">Sobremesas</option>
                            <option value="lanches">Lanches</option>
                        </select>
                    </div>

                    <div class="campo-cadastro">
                        <label for="tempo-preparo">
                            <i class="fa-regular fa-clock"></i>
                            Tempo de preparo
                        </label>

                        <input type="text" id="tempo-preparo"
                            name="tempo-preparo" placeholder="Ex.: 1h30min" class="entrada-cadastro"
                            required>
                    </div>

                    <div class="campo-cadastro">
                        <label for="dificuldade">
                            <i class="fa-solid fa-chart-simple"></i>
                            Dificuldade
                        </label>

                        <select id="dificuldade" name="dificuldade" required>
                            <option value="" disabled selected hidden>
                                Selecione a dificuldade
                            </option>
                            <option value="facil">Fácil</option>
                            <option value="medio">Médio</option>
                            <option value="dificil">Difícil</option>
                        </select>
                    </div>

                    <div class="campo-cadastro">
                        <label for="rendimento">
                            <i class="fa-solid fa-users"></i>
                            Rendimento
                        </label>

                        <input type="text" id="rendimento"
                            name="rendimento" placeholder="Ex.: 6 porções" class="entrada-cadastro"
                            required>
                    </div>

                </div>

                <div class="linha-preparo-cadastro">

                    <div class="campo-cadastro">
                        <label for="ingredientes">
                            <i class="fa-solid fa-basket-shopping"></i>
                            Ingredientes
                        </label>

                        <textarea id="ingredientes" name="ingredientes"
                            placeholder="Digite os ingredientes da receita"
                            required></textarea>
                    </div>

                    <div class="campo-cadastro">
                        <label for="modo-preparo">
                            <i class="fa-solid fa-list-check"></i>
                            Modo de preparo
                        </label>

                        <textarea id="modo-preparo" name="modo-preparo"
                            placeholder="Descreva o passo a passo da receita"
                            required></textarea>
                    </div>

                </div>

                <div class="acoes-cadastro">
                    <button type="submit" class="botao-cadastrar">
                        <i class="fa-solid fa-check"></i>
                        Cadastrar receita
                    </button>

                    <button type="reset" class="botao-cancelar">
                        <i class="fa-solid fa-xmark"></i>
                        Cancelar
                    </button>
                </div>

            </form>

        </section>
    </main>

    <footer class="rodape">

        <div class="rodape-conteudo">

            <div class="rodape-logo">
                <a href="../index.html">
                    <img src="assets/img/logo-chefbox-transparente.png" alt="Logo ChefBox">
                </a>

                <p>
                    Receitas deliciosas para todos os momentos.
                </p>
            </div>

            <div class="rodape-links">

                <a href="../index.html">Início</a>
                <a href="receitas.html">Receitas</a>
                <a href="favoritos.html">Favoritos</a>
                <a href="sobre.html">Sobre</a>
            </div>

            <div class="redes-sociais">
                <a href="#" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a href="#" aria-label="LinkedIn">
                    <i class="fa-brands fa-linkedin-in"></i>
                </a>

                <a href="#" aria-label="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>

                <a href="#" aria-label="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
            </div>

        </div>

        <hr>

        <div class="rodape-final">
            <p>&copy; 2026 ChefBox. Todos os direitos reservados.</p>
        </div>

    </footer>
</body>
</html>

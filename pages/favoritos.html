<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos - ChefBox</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="assets/css/style.css">

    <link rel="stylesheet" href="assets/css/favoritos.css">
</head>

<body>
    <header class="cabecalho">
        <a href="../index.html" class="logo">
            <img src="assets/img/logo-chefbox-transparente.png" alt="Logo ChefBox">
        </a>

        <nav class="menu">
            <a href="../index.html">Início</a>
            <a href="receitas.html">Receitas</a>
            <a href="favoritos.html">Favoritos</a>
            <a href="sobre.html">Sobre</a>
        </nav>

        <a href="cadastrar_receita.html" class="cadastro-cabecalho">
            Cadastrar
        </a>
    </header>

    <main class="principal">

        <section class="secao-principal banner-favoritos">

            <img src="assets/img/hero-favoritos.png" alt="Prato de macarrão com tomates e manjericão"
                class="imagem-principal">

            <div class="gradiente-principal"></div>

            <div class="conteudo-principal">
                <p class="paragrafo-principal">FAVORITOS</p>

                <h1 class="titulo">Minhas receitas <span>favoritas</span></h1>

                <p class="descricao-principal">
                    Encontre aqui todas as receitas que você salvou para preparar depois.
                </p>

                <label for="pesquisa" class="rotulo-pesquisa-destaque">
                    Encontre uma receita que você salvou
                </label>

                <form class="form-pesquisa" id="form-pesquisa">
                    <div class="campo-pesquisa">
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                        <input type="search" id="pesquisa" name="pesquisa" placeholder="Buscar nos favoritos..."
                            maxlength="100" class="pesquisa-receita">
                    </div>
                    <button type="submit" class="botao-receitas">
                        Buscar</button>
                </form>
            </div>
        </section>
        <section class="receitas-favoritas">

            <h2>Receitas favoritas</h2>

            <div class="lista-receitas" id="lista-favoritos"></div>
        </section>
    </main>

    <footer class="rodape">

        <div class="rodape-conteudo">

            <div class="rodape-logo">
                <a href="../index.html">
                    <img src="assets/img/logo-chefbox-transparente.png" alt="Logo ChefBox">
                </a>

                <p>
                    Receitas deliciosas para todos os momentos.
                </p>
            </div>

            <div class="rodape-links">

                <a href="../index.html">Início</a>
                <a href="receitas.html">Receitas</a>
                <a href="favoritos.html">Favoritos</a>
                <a href="sobre.html">Sobre</a>
            </div>

            <div class="redes-sociais">
                <a href="https://www.instagram.com/yago._teixeira/" target="_blank" rel="noopener noreferrer"
                    aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a href="https://www.linkedin.com/in/yago-teixeira-almeida-nascimento-851353353/" target="_blank"
                    rel="noopener noreferrer" aria-label="LinkedIn">
                    <i class="fa-brands fa-linkedin-in"></i>
                </a>

                <a href="https://github.com/Yago-dev-07" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>

                <a href="https://www.facebook.com/yago.teixeiraalmeidanascimento/" target="_blank"
                    rel="noopener noreferrer" aria-label="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
            </div>

        </div>

        <hr>

        <div class="rodape-final">
            <p>&copy; 2026 ChefBox. Todos os direitos reservados.</p>
        </div>

    </footer>

    <script src="assets/js/dados.js"></script>
    <script src="assets/js/armazenamento.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/config-spoonacular.js"></script>
    <script src="assets/js/api-spoonacular.js"></script>
    <script src="assets/js/favoritos.js"></script>
    <script src="assets/js/pagina-favoritos.js"></script>

</body>

</html>
